apiVersion: apps/v1
kind: Deployment
metadata:
  name: attestation-policy-gateway
  labels:
    app: attestation-policy-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attestation-policy-gateway
  template:
    metadata:
      labels:
        app: attestation-policy-gateway
    spec:
      containers:
        - name: gateway
          image: attestation-policy-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          args: ["--addr", ":8080", "--data-dir", "/data"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
